<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 30px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, -25px) scale(1.2); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 0.95; transform: translateY(-4px); }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 {
      animation: floatOrb1 12s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 15s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: waveDash 4s linear infinite;
    }
    .card-float {
      animation: pulseCard 6s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <g filter="url(#softGlow)" opacity="0.45">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#6366f1" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#0ea5e9" />
    <circle class="orb-1" cx="800" cy="90" r="100" fill="#a855f7" />
  </g>

  <!-- Tech Geometric Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" />
    <path d="M 150 0 L 150 420 M 300 0 L 300 420 M 450 0 L 450 420 M 600 0 L 600 420 M 750 0 L 750 420 M 900 0 L 900 420 M 1050 0 L 1050 420" />
  </g>

  <!-- Dynamic Wave & Data Pulse Streams Behind Text -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 310 C 250 240, 450 370, 750 300 C 950 250, 1100 330, 1250 290" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    <path class="stream-line" d="M -50 330 C 200 270, 500 390, 800 310 C 1000 260, 1150 350, 1250 310" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Background Decorative Interactive Pill Badges -->
  <g class="card-float" opacity="0.8">
    <rect x="80" y="45" width="160" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="100" cy="62" r="5" fill="#10b981" />
    <text x="115" y="67" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">Voice &amp; Multi-Modal</text>

    <rect x="960" y="55" width="155" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="980" cy="72" r="5" fill="#38bdf8" />
    <text x="995" y="77" fill="#e2e8f0" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">Autonomous Agents</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, clean visibility -->
  <g transform="translate(600, 155)">
    <!-- Main Title with Gradient fill -->
    <text class="text-title" text-anchor="middle" y="0" font-size="44" fill="#ffffff">
      Awesome AI Conversational Chatbots
    </text>
    <text class="text-title" text-anchor="middle" y="4" font-size="44" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)">
      Awesome AI Conversational Chatbots
    </text>

    <!-- Subtitle / Tagline -->
    <text class="text-sub" text-anchor="middle" y="46" font-size="19" fill="#94a3b8">
      Curated Leaderboard of Enterprise SaaS Platforms &amp; Open-Source AI Agent Frameworks
    </text>

    <!-- Highlights Pill Rack -->
    <g transform="translate(-360, 85)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="80" y="24" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">🤖 AI Support Agents</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="170" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="#818cf8" stroke-width="1.5" />
      <text x="265" y="24" fill="#a5b4fc" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">🎙️ Real-Time Voice AI</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="165" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="#c084fc" stroke-width="1.5" />
      <text x="452" y="24" fill="#d8b4fe" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">⚡ Visual Flow Builders</text>

      <!-- Pill 4 -->
      <rect x="555" y="0" width="165" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="#10b981" stroke-width="1.5" />
      <text x="637" y="24" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">🔒 100% Self-Hosted</text>
    </g>
  </g>

  <!-- Modern Subtle Border -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
</svg>
